<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sandeep Kumar Chaurasiya – Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #aaa;
            line-height: 1.6;
        }

        .loader {
            width: 42px;
            height: 42px;
            margin: 25px auto;
            border: 4px solid #333;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Resume</h1>

    <p id="status">
        Your resume download is starting...
    </p>

    <div class="loader"></div>

    <p>
        You will be redirected to the 3D portfolio shortly.
    </p>

    <!-- Backup download button -->
    <a
        id="manualDownload"
        class="download-btn"
        href="https://san78141.github.io/SandeepKumarChaurasiya3D-Portfolio/Sandeep_Kumar_Chaurasiya_Resume.pdf"
        download="Sandeep_Kumar_Chaurasiya_Resume.pdf">
        Download Resume
    </a>

</div>

<script>

    const resumeURL =
        "https://san78141.github.io/SandeepKumarChaurasiya3D-Portfolio/Sandeep_Kumar_Chaurasiya_Resume.pdf";

    const portfolioURL =
        "https://san78141.github.io/SandeepKumarChaurasiya3D-Portfolio/";

    async function downloadResume() {

        try {

            const response = await fetch(resumeURL);

            if (!response.ok) {
                throw new Error("PDF could not be loaded.");
            }

            const blob = await response.blob();

            const blobURL = window.URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = blobURL;
            link.download = "Sandeep_Kumar_Chaurasiya_Resume.pdf";

            document.body.appendChild(link);

            link.click();

            link.remove();

            window.URL.revokeObjectURL(blobURL);

        } catch (error) {

            console.log("Automatic download failed:", error);

            document.getElementById("status").innerText =
                "Click the button below to download your resume.";

        }

    }

    // Start download
    downloadResume();

    // Redirect after 5 seconds
    setTimeout(function() {

        window.location.href = portfolioURL;

    }, 5000);

</script>

</body>
</html>
